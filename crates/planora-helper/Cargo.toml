[package]
name = "planora-helper"
version = "0.1.2"
edition.workspace = true

[dependencies]
planora-core = { path = "../planora-core" }
planora-topology = { path = "../planora-topology" }
planora-telemetry = { path = "../planora-telemetry" }
planora-bench = { path = "../planora-bench" }
serde_json.workspace = true
serde.workspace = true
interprocess.workspace = true
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_System_Services", "Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation"] }
widestring = "1.2"

[[bin]]
name = "planora-helper"
path = "src/main.rs"
