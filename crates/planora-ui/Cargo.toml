[package]
name = "planora-ui"
version = "0.1.1"
edition.workspace = true
build = "build.rs"

[dependencies]
planora-core = { path = "../planora-core" }
planora-helper = { path = "../planora-helper" }
planora-telemetry = { path = "../planora-telemetry" }
eframe.workspace = true
serde.workspace = true
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
serde_json.workspace = true
cc = "1"

[[bin]]
name = "planora"
path = "src/main.rs"
