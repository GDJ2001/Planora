[package]
name = "planora-telemetry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
planora-core = { path = "../planora-core" }
sysinfo.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Performance"] }

[dev-dependencies]
planora-bench = { path = "../planora-bench" }
planora-topology = { path = "../planora-topology" }
