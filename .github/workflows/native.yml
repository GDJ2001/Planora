name: Native build and packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned 2026-10-20
        with:
          toolchain: '1.99.1'
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $env:PATH = "$HOME\.dotnet\tools;$env:PATH"
          wix extension add -g WixToolset.BootstrapperApplications.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
          ./packaging/windows/Build-Planora.ps1
      - run: python scripts/release_inventory.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: planora-windows-x64
          path: |
            dist/*.msi
            dist/*-Setup.exe
            dist/*.manifest.json
            dist/dependency-inventory.json
            dist/SHA256SUMS.txt
            dist/provenance.json

  ubuntu:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Native libraries
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev libpolkit-gobject-1-dev libbpf-dev libelf-dev zlib1g-dev clang linux-libc-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned 2026-10-20
        with:
          toolchain: '1.99.1'
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --release --bins --locked
      - run: bash packaging/linux/build-deb.sh
      - run: python3 scripts/release_inventory.py
      - run: dpkg-deb --contents dist/*.deb | head -80
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: planora-${{ matrix.runner }}-amd64
          path: |
            dist/*.deb
            dist/dependency-inventory.json
            dist/SHA256SUMS.txt
            dist/provenance.json

  fedora:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - run: dnf install -y git
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: dnf install -y gcc clang cmake pkgconf-pkg-config libX11-devel libxkbcommon-devel wayland-devel rpm-build curl tar gzip python3 libbpf-devel elfutils-libelf-devel zlib-devel kernel-headers
      - run: curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain 1.99.1 -c clippy,rustfmt
      - run: |
          . "$HOME/.cargo/env"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo build --release --bins --locked
          bash packaging/linux/build-rpm.sh
          python3 scripts/release_inventory.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: planora-fedora44-x86_64
          path: |
            dist/*.rpm
            dist/dependency-inventory.json
            dist/SHA256SUMS.txt
            dist/provenance.json

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned 2026-10-20
        with:
          toolchain: '1.99.1'
          targets: aarch64-apple-darwin
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: bash packaging/macos/build-package.sh
      - run: python3 scripts/release_inventory.py
      - run: pkgutil --payload-files dist/*.pkg | head -80
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: planora-macos-arm64
          path: |
            dist/*.pkg
            dist/*-app.zip
            dist/dependency-inventory.json
            dist/SHA256SUMS.txt
            dist/provenance.json

  advisory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned 2026-10-20
        with:
          toolchain: '1.99.1'
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit

  parser-fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install nightly --component rust-src
      - run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - run: cargo +nightly fuzz run ipc_frames -- -max_total_time=90 -max_len=65540
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: planora-parser-fuzz-artifacts
          path: fuzz/artifacts
